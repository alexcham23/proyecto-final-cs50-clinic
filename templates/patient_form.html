{% extends "layout.html" %}

{% block title %}
    New Patient
{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0 p-4"> 
                <div class="card-body p-4">
                    <h4 class="card-title mb-4 fw-bold text-uppercase">Patient Register</h4>
                    <form action="/patients/new" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3 text-start">
                                <label for="first_name">First Name</label>
                                <input  class="form-control" type="text" name="first_name" id="first_name" placeholder="John" required>
                            </div>
                            <div class="col-md-6 mb-3 text-start">
                                <label for="last_name">Last Name</label>
                                <input  class="form-control" type="text" name="last_name" id="last_name" placeholder="Doe" required>
                            </div>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label" for="phone"> Phone</label>
                            <input class="form-control" type="tel" name="phone" id="phone" placeholder="1234567890" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label" for="email">Email (Optional)</label>
                            <input class="form-control" type="email" name="email" id="email" placeholder="john.doe@example.com">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Patient Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
